[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minimal-robot-harness"
version = "0.1.0"
description = "Minimal multimodal robot rollout loop and calibrated TCP overlay"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "Pillow>=10"]

[project.scripts]
eta0-run = "eta0_run:main"

[project.optional-dependencies]
libero = ["openeta-bench @ git+https://github.com/OpenETA7/OpenETA-Benchmark.git@c39883cd94c3b413c19e048ab82317fc6e024fa1"]
dev = ["pytest>=8", "ruff>=0.9"]

[tool.setuptools]
py-modules = ["harness", "tcp_overlay", "tcp_overlay_adapter", "visual_query", "rollout_context", "hierarchy", "executor_led", "libero_semantics", "eta0_run"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
extend-exclude = ["r27"] # Frozen reference package has its own tests and source hashes.
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
